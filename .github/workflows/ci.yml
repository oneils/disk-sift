name: build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: build
    # pinned image and Xcode so toolchain updates don't change CI silently
    runs-on: macos-15
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: select xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: swift version
        run: swift --version

      - name: lint
        run: make lint

      - name: test
        run: make test

      - name: app bundle
        run: UNIVERSAL=1 make app check-app
